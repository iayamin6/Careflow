<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareFlow • Wallet intelligence</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e2e8f0;background:#0c1423}body{margin:0}header{padding:28px 5%;border-bottom:1px solid #243147;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}h2{font-size:20px}h3{font-size:15px;color:#9bacc6}p{color:#a9bad2;line-height:1.5}main{max-width:1400px;margin:32px auto;padding:0 5%}button,select{background:#192b43;color:#e2e8f0;border:1px solid #38516f;border-radius:7px;padding:10px;cursor:pointer}button:hover{background:#28506a}button:disabled{opacity:.5;cursor:wait}a{color:#5de1cd}.badge{font-size:12px;border:1px solid #45617b;padding:6px 10px;border-radius:20px;color:#70e5c4}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,section{background:#121f32;border:1px solid #26364e;border-radius:12px;padding:20px;margin-bottom:20px}.metric{font-size:28px;font-weight:600}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #26364e}th{color:#96aecb}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6;color:#c3d2e6}.error{color:#ffaeae}.sub{font-size:12px;color:#91a9c4}.trend{display:flex;height:100px;align-items:end;gap:6px}.bar{flex:1;background:#4ad8bb;min-height:2px;border-radius:3px 3px 0 0}dialog{background:#142338;color:#ddd;max-width:800px;width:80%;border:1px solid #45617b;border-radius:14px}input{padding:10px;background:#0c1423;color:#eee;border:1px solid #38516f;border-radius:7px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}header{display:block}}
</style></head><body><header><div><h1>CareFlow <span style="color:#63d9c5">/ Wallet intelligence</span></h1><p>Payment experience → behavior → decisions → follow-up</p></div><div><span class="badge">Synthetic data · dry-run actions</span><p><a href="/">Original customer dashboard</a> · <a href="/docs">API reference</a></p></div></header>
<main><section id="login"><h2>Operator sign in</h2><p>Use your assigned operator token. Access and actions follow your role.</p><form onsubmit="signIn(event)"><input id="operator-token" type="password" autocomplete="off" aria-label="Operator token" required><button>Sign in</button></form><p id="login-error" class="error"></p></section><p><span id="operator"></span> <button onclick="signOut()">Sign out</button></p><p id="notice">Loading wallet analytics…</p><div class="grid" id="metrics"></div><div class="tabs"><button onclick="show('executive')">Executive overview</button><button onclick="show('overview')">Reliability</button><button onclick="show('customers')">Customers</button><button onclick="show('merchants')">Merchants</button><button onclick="show('decisions')">Decision center</button><button onclick="show('models')">Models</button><button onclick="show('automation')">Automation</button><button onclick="show('incidents')">Incidents</button><button onclick="show('servicing')">Settlements & refunds</button><button onclick="show('preferences')">Preferences</button><button onclick="show('complaints')">Complaints</button><button onclick="show('batch')">Spark analytics</button><button onclick="show('experiments')">Experiments</button><button onclick="show('governance')">Model governance</button><button onclick="show('deliveries')">Delivery outbox</button><button id="refresh" onclick="refreshDecisions()">Refresh decisions</button></div><div id="content"></div></main><dialog id="detail"><button onclick="document.querySelector('dialog').close()">Close</button><pre id="detailtext"></pre></dialog>
<script>
let state={},current='overview';const $=id=>document.getElementById(id);const pct=v=>v==null?'Insufficient data':(v*100).toFixed(1)+'%';const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const headers={'Authorization':'Bearer '+(sessionStorage.getItem('careflow-token')||'')};if(body!==undefined)headers['Content-Type']='application/json';const r=await fetch('/wallet/'+path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
async function load(){try{state.s=await api('analytics');state.actions=(await api('actions')).data;const w=state.s.windows['7d'];$('notice').textContent='Observed as of '+new Date(state.s.as_of).toLocaleString()+'. Patterns require investigation; they are not proof of technical root cause.';$('metrics').innerHTML=[['Attempts · 7 days',w.attempts],['Attempt success',pct(w.attempt_success_rate)],['Transaction completion',pct(w.completion_rate)],['Open actions',state.actions.filter(a=>['pending','approved','retry'].includes(a.status)).length]].map(([label,value])=>'<div class="card"><h3>'+esc(label)+'</h3><div class="metric">'+esc(value)+'</div></div>').join('');show(current)}catch(e){$('notice').textContent=e.message;$('notice').className='error'}}
async function show(tab){current=tab;const s=state.s;if(!s)return;let html='';if(tab==='overview'){html='<section><h2>Payment reliability</h2><p>Attempt outcomes and transaction completion are distinct. A recovered timeout remains in the timeout rate.</p>'+table(['Window','Attempts','Success','Failed / timeout','Pending','Timeout observed','Refund / reversal','Latency p95'],Object.entries(s.windows).map(([k,v])=>[esc(k),v.attempts,pct(v.attempt_success_rate),pct(v.failure_rate),pct(v.pending_rate),pct(v.timeout_rate),pct(v.refund_reversal_rate),esc(v.latency_p95_ms==null?'—':Math.round(v.latency_p95_ms)+' ms')]))+'</section><section><h2>Observed success rate · last 14 days</h2><div class="trend">'+s.daily_trend.map(d=>'<div class="bar" title="'+esc(d.date+': '+pct(d.attempt_success_rate)+' ('+d.attempts+' attempts)')+'" style="height:'+(d.attempt_success_rate==null?0:d.attempt_success_rate*100)+'%"></div>').join('')+'</div><p class="sub">Hover for date, denominator and rate. Empty periods have no rate.</p></section><section><h2>Channels · 7 days</h2>'+table(['Channel','Attempts','Success','Failure'],Object.entries(s.channels_7d).map(([k,v])=>[esc(k),v.attempts,pct(v.attempt_success_rate),pct(v.failure_rate)]))+'</section>'}
if(tab==='customers')html='<section><h2>Customer behavior</h2><p>Health combines reliability (50%), engagement relative to prior activity (30%), and recency (20%). Sparse histories have no score.</p>'+table(['Customer','Segments','Health','Transactions / 30d','Recency','Open payment issues','Details'],s.customers.map(c=>[esc(c.id),esc(c.segments.join(', ')),esc(c.health_score),c.behavior.frequency_30d,esc(c.behavior.recency_days),c.unresolved_transactions,'<button onclick="inspect(\'customers\',\''+encodeURIComponent(c.id)+'\')">Explain</button>']))+'</section>';
if(tab==='merchants')html='<section><h2>Merchant experience</h2><p>Changes are evaluated against each merchant’s baseline with minimum sample sizes.</p>'+table(['Merchant','Category','Segments','Health','7d success','Affected customers','Details'],s.merchants.map(m=>[esc(m.id),esc(m.category),esc(m.segments.join(', ')),esc(m.health_score),pct(m.reliability_7d.attempt_success_rate),m.affected_customers.length,'<button onclick="inspect(\'merchants\',\''+encodeURIComponent(m.id)+'\')">Evidence</button>']))+'</section>';
if(tab==='decisions')html='<section><h2>Decision center</h2><p>Customer outreach requires consent and approval. Execution writes a dry-run outbox entry; it does not send a real message.</p>'+table(['Entity','Recommendation','Priority','Status','Evidence','Action'],state.actions.map(a=>[esc(a.entity_type+' '+a.entity_id),esc(a.kind),esc(a.priority),esc(a.status),'<button onclick="actionDetail('+a.id+')">View</button>',(a.status==='pending'&&a.approval_required&&!a.approved?'<button onclick="act('+a.id+',\'approve\')">Approve</button>':'')+(['pending','approved','retry'].includes(a.status)?'<button onclick="act('+a.id+',\'execute\')">Dry run</button><button onclick="dismissAction('+a.id+')">Dismiss</button>':'')]))+'</section>';
if(tab==='models'){try{const m=await api('models');html='<section><h2>Model monitoring</h2><p>Temporal evaluation on synthetic data. SHAP explains the raw model; sigmoid calibration produces the displayed probability.</p>'+table(['Model','Selected algorithm','Test PR-AUC','Baseline PR-AUC','Brier score','Tracking'],Object.entries(m).map(([name,v])=>[esc(name),esc(v.algorithm??v.status),esc(v.test?.pr_auc?.toFixed(3)),esc(v.baseline_test?.pr_auc?.toFixed(3)),esc(v.test?.brier?.toFixed(3)),esc(v.tracking)]))+'<details><summary>Training windows, drift and full evaluation</summary><pre>'+esc(JSON.stringify(m,null,2))+'</pre></details></section><section><h2>Pre-attempt payment risk</h2><input id="pc" placeholder="Customer ID e.g. W0001"><input id="pm" placeholder="Merchant ID e.g. M001"><input id="pa" type="number" min="1" value="10000" aria-label="Amount in paisa"><select id="pch"><option>app</option><option>qr</option><option>ussd</option></select><button onclick="predictPayment()">Estimate</button></section>'}catch(e){html=esc(e.message)}}
if(tab==='automation'){try{const a=await api('automation');const o=await api('outcomes');html='<section><h2>Workflow executions</h2>'+table(['Action','Status','Mode','Recorded at'],a.executions.map(e=>[e.action_id,esc(e.status),esc(e.transport),esc(new Date(e.created_at).toLocaleString())]))+'<details><summary>Execution details and audit trail</summary><pre>'+esc(JSON.stringify(a,null,2))+'</pre></details></section><section><h2>Observed follow-up</h2><p>Before/after activity is observational. Dry-run actions do not establish retention uplift.</p>'+table(['Action','Entity','Days observed','Prior 7d successes','After successes','Follow-up'],o.data.map(x=>[x.action_id,esc(x.entity_id),x.days_observed_after,x.baseline_successful_transactions,x.after_successful_transactions,x.follow_up_complete?'Complete':'Still observing']))+'</section>'}catch(e){html=esc(e.message)}}$('content').innerHTML=html}
function modal(data){$('detailtext').textContent=JSON.stringify(data,null,2);$('detail').showModal()}
async function inspect(kind,id){try{modal(await api(kind+'/'+id))}catch(e){modal({error:e.message})}}
function actionDetail(id){modal(state.actions.find(a=>a.id===id))}
async function act(id,action){try{modal(await api('actions/'+id+'/'+action,action==='execute'?{execution_key:'ui-'+id+'-'+crypto.randomUUID()}:{}));await load()}catch(e){modal({error:e.message})}}
async function refreshDecisions(){$('refresh').disabled=true;try{await api('decisions/refresh',{});await load()}catch(e){modal({error:e.message})}finally{$('refresh').disabled=false}}
async function predictPayment(){try{modal(await api('payment/predict',{customer_id:$('pc').value,merchant_id:$('pm').value,amount_minor:Number($('pa').value),channel:$('pch').value}))}catch(e){modal({error:e.message})}}
</script><script src="/static/wallet-operations.js"></script></body></html>
